name: Deploy docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  release:
    types: [published]

jobs:
  build-docs:
    name: "Build and deploy docs"
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      pull-requests: write
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install llvmpipe and lavapipe for offscreen canvas
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install --no-install-recommends -y ffmpeg libegl1-mesa-dev libgl1-mesa-dri libxcb-xfixes0-dev mesa-vulkan-drivers
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          # remove pygfx from install_requires, we install using pygfx@main
          sed -i "/pygfx/d" ./pyproject.toml
          pip install git+https://github.com/pygfx/pygfx.git@main
          pip install -e ".[docs,notebook,imgui]"
      - name: Show wgpu backend
        run:
          python -c "from examples.tests.testutils import wgpu_backend; print(wgpu_backend)"

      # set DOCS_VERSION_DIR (deploy path) and DOCS_VERSION_MATCH (switcher highlight)
      # before the build so conf.py and switcher.json generation can use them
      - name: Set version environment variables
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            echo "DOCS_VERSION_DIR=${TAG}" >> "$GITHUB_ENV"
            echo "DOCS_VERSION_MATCH=${TAG#v}" >> "$GITHUB_ENV"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "DOCS_VERSION_DIR=dev" >> "$GITHUB_ENV"
            echo "DOCS_VERSION_MATCH=dev" >> "$GITHUB_ENV"
          else
            echo "DOCS_VERSION_DIR=${{ github.head_ref }}" >> "$GITHUB_ENV"
            echo "DOCS_VERSION_MATCH=dev" >> "$GITHUB_ENV"
          fi

      - name: Generate switcher.json
        run: |
          python - <<'EOF'
          import json, subprocess, re, pathlib

          tags = subprocess.run(
              ["git", "tag", "--sort=-version:refname"],
              capture_output=True, text=True
          ).stdout.splitlines()
          # exclude pre-v0.3.0 tags (no docs exist for those)
          tags = [t for t in tags if re.match(r"^v\d+\.\d+\.\d+$", t) and t >= "v0.3.0"]

          entries = [{"name": "dev", "version": "dev", "url": "https://www.fastplotlib.org/ver/dev/"}]
          for i, tag in enumerate(tags):
              ver = tag.lstrip("v")
              if i == 0:
                  entries.append({"name": f"{ver} (stable)", "version": ver,
                                  "url": "https://www.fastplotlib.org/", "preferred": True})
              else:
                  entries.append({"name": ver, "version": ver,
                                  "url": f"https://www.fastplotlib.org/ver/{tag}/"})

          p = pathlib.Path("docs/source/_static/switcher.json")
          p.write_text(json.dumps(entries, indent=2) + "\n")
          EOF

      - name: Build docs
        run: |
          cd docs
          DOCS_BUILD=1 make html SPHINXOPTS="-W --keep-going"

      # upload docs via SCP
      - name: Deploy docs
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DOCS_SERVER }}
          username: ${{ secrets.DOCS_USERNAME }}
          port: ${{ secrets.DOCS_PORT }}
          key: ${{ secrets.DOCS_KEY }}
          passphrase: ${{ secrets.DOCS_PASS }}
          source: "docs/build/html/*"
          # without strip_components it creates dirs docs/build/html within /ver on the server
          strip_components: 3
          target: /home/${{ secrets.DOCS_USERNAME }}/public_html/ver/${{ env.DOCS_VERSION_DIR }}/

      # comment on PR to provide link to built docs
      - name: Add PR link in comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            📚 Docs preview built and uploaded! https://www.fastplotlib.org/ver/${{ env.DOCS_VERSION_DIR }}

      # upload docs via SCP
      - name: Deploy docs release
        if: ${{ github.ref_type == 'tag' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DOCS_SERVER }}
          username: ${{ secrets.DOCS_USERNAME }}
          port: ${{ secrets.DOCS_PORT }}
          key: ${{ secrets.DOCS_KEY }}
          passphrase: ${{ secrets.DOCS_PASS }}
          source: "docs/build/html/*"
          # without strip_components it creates dirs docs/build/html within /ver on the server
          strip_components: 3
          target: /home/${{ secrets.DOCS_USERNAME }}/public_html/
